<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Baloo;src:url(Baloo2.ttf);font-weight:400 800}
@font-face{font-family:Nunito;src:url(Nunito.ttf);font-weight:400 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#stage{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 45%}
#shadow{position:absolute;width:520px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,30,25,.55),rgba(40,30,25,0));filter:blur(14px)}
#ph{position:absolute;width:560px;height:1212px;transform-style:preserve-3d;will-change:transform}
.lay{position:absolute;inset:0;border-radius:86px;background:#1b2030}
.edge{background:linear-gradient(90deg,#3b4258,#141826 30%,#2b3146 70%,#4a5270)}
#face{position:absolute;inset:0;border-radius:86px;background:#10131d;box-shadow:inset 0 0 0 3px #454c66,inset 0 0 0 7px #0b0d14}
#scr{position:absolute;left:18px;top:18px;right:18px;bottom:18px;border-radius:70px;overflow:hidden;background:#fbefe3}
#scr img{width:100%;height:100%;object-fit:cover;display:block}
#gl{position:absolute;inset:0;border-radius:86px;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,rgba(255,255,255,.08) 100%);pointer-events:none}
#txt{position:absolute;left:0;right:0;text-align:center;font-family:Baloo;font-weight:800;font-size:88px;line-height:1.08;color:#283044}
#txt .w{display:inline-block;white-space:pre}
#txt .l2 .w{color:#964e34}
#txt .bgp{display:inline-block;padding:26px 54px 22px;border-radius:64px;background:rgba(251,239,227,.93);box-shadow:0 18px 50px rgba(40,48,68,.22)}
</style></head><body>
<div id="txt"><div class="bgp"><div class="l1"></div><div class="l2"></div></div></div>
<div id="stage"><div id="shadow"></div><div id="ph"><div id="face"><div id="scr"><img id="im"></div></div><div id="gl"></div></div></div>
<script>
const ph=document.getElementById('ph'),sh=document.getElementById('shadow'),im=document.getElementById('im'),txt=document.getElementById('txt');
for(let i=1;i<=14;i++){const d=document.createElement('div');d.className='lay edge';d.style.transform=`translateZ(${-i*2}px)`;ph.insertBefore(d,ph.firstChild)}
const back=document.createElement('div');back.className='lay';back.style.transform='translateZ(-30px)';ph.insertBefore(back,ph.firstChild);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3), eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back2=x=>{x=clamp(x);const c=1.4;return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let C=null;
function words(el,s){el.innerHTML='';s.split(' ').forEach((w,i,a)=>{const sp=document.createElement('span');sp.className='w';sp.textContent=w+(i<a.length-1?' ':'');el.appendChild(sp)})}
window.setup=async c=>{C=c;words(txt.querySelector('.l1'),c.l1);words(txt.querySelector('.l2'),c.l2||'');txt.style.top=(c.ty??150)+'px';
  await document.fonts.load('800 88px Baloo');await document.fonts.ready;return true};
window.setT=async t=>{const c=C,D=c.dur;
  // phone pose
  const tin=back2((t-c.in)/0.9), tout=eio((t-(D-0.45))/0.45);
  const side=c.side; // -1 left, 1 right
  const x0=c.x, y0=c.y;
  const fx=(1-eo((t-c.in)/0.9))*side*900 + tout*side*1100;
  const bob=Math.sin((t+c.ph)*1.7)*14;
  const ry=c.ry + (1-tin)*side*70 + Math.sin((t+c.ph)*0.9)*5 + (t/D-.5)*c.spin + tout*side*50;
  const rx=c.rx + Math.cos((t+c.ph)*1.1)*2.5;
  const rz=c.rz + Math.sin((t+c.ph)*0.8)*1.2;
  const s=c.s*(0.82+0.18*tin)*(1+0.03*t/D);
  ph.style.left=(x0-280)+'px';ph.style.top=(y0-606)+'px';
  ph.style.transform=`translate3d(${fx}px,${bob}px,0) scale(${s}) rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;
  ph.style.opacity=t<c.in?0:1;
  sh.style.left=(x0-260+fx+ry*2)+'px';sh.style.top=(y0+606*s+30)+'px';sh.style.transform=`scale(${s*(1-bob/160)})`;sh.style.opacity=t<c.in?0:clamp((t-c.in)/0.8)*(1-tout)*0.9;
  // screen frame
  const f=Math.max(1,Math.min(c.n,Math.round((t-c.in-0.5)*c.fps*(c.speed||1))+1));
  const src=c.dir+'/'+String(f).padStart(4,'0')+'.jpg';
  if(im.dataset.s!==src){im.dataset.s=src;im.src=src;await im.decode().catch(()=>{})}
  // text
  const ws=[...txt.querySelectorAll('.w')];
  ws.forEach((w,i)=>{const p=back2((t-c.tin-i*0.09)/0.5);w.style.opacity=clamp((t-c.tin-i*0.09)/0.25);w.style.transform=`translateY(${(1-p)*46}px) scale(${0.7+0.3*p})`});
  const bp=txt.querySelector('.bgp');const q=back2((t-c.tin+0.1)/0.5);bp.style.transform=`scale(${0.6+0.4*q})`;bp.style.opacity=clamp((t-c.tin+0.1)/0.2)*(1-clamp((t-(D-0.35))/0.3));
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
};
</script></body></html>
