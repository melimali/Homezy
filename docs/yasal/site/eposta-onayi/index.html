<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Homezy · E-posta onaylandı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;700&display=swap">
<style>
  :root { --bg: #EBF5EE; --ink: #283044; --muted: #8B786D; --card: #FFFFFF; --btn: #283044; --btnink: #EBF5EE; }
  @media (prefers-color-scheme: dark) { :root { --bg: #283044; --ink: #EBF5EE; --muted: #BFA89E; --card: #333C52; --btn: #78A1BB; --btnink: #283044; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.6 Nunito, system-ui, sans-serif; }
  main { max-width: 440px; margin: 16px; padding: 32px 24px; background: var(--card); border-radius: 22px; text-align: center; }
  h1 { font-family: "Baloo 2", system-ui, sans-serif; font-size: 30px; line-height: 1.2; margin: 8px 0; }
  .muted { color: var(--muted); font-size: 14px; letter-spacing: .08em; }
  .btn { display: inline-block; margin-top: 16px; padding: 12px 28px; border-radius: 999px; background: var(--btn); color: var(--btnink); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<main>
<p class="muted">HOMEZY</p>
<h1>E-postan onaylandı ✓</h1>
<p>Hesabın hazır. Uygulamaya dönüp e-posta ve şifrenle giriş yapabilirsin.</p>
<a class="btn" href="homezy://giris">Homezy'yi aç</a>
<p class="muted" style="letter-spacing:0;margin-top:20px">Email confirmed. Open the Homezy app and sign in.</p>
<p class="muted" style="letter-spacing:0">Uygulama açılmazsa telefonundan Homezy'yi kendin aç.</p>
</main>
</body>
</html>
