*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-weight:600;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.logo .w1{color:var(--ink)}.logo .w2{color:var(--warm)}

kfSwAAAABJRU5ErkJggg==") center/cover no-repeat;box-shadow:0 3px 8px var(--shadow);flex:0 0 auto}
.datechip{font-size:.75rem;font-weight:700;color:var(--muted);background:var(--surface);border:1.5px solid var(--line);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:.76rem;color:var(--muted);font-weight:600}
.tiny{font-size:.76rem;margin:0}
.muted{color:var(--muted)}
.h1{font-family:var(--f-display);font-weight:600;font-size:1.7rem;line-height:1.12;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font-family:var(--f-display);font-size:1.08rem;font-weight:600;margin:0}
.h3{font-family:var(--f-display);font-size:.95rem;font-weight:600;margin:0}
.eyebrow{margin:0 0 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--warm);font-weight:800}
.spark{position:relative;display:inline-block;padding-right:22px}
.spark::after{content:"";position:absolute;right:0;top:-4px;width:16px;height:18px;background:
  linear-gradient(var(--clay),var(--clay)) 50% 0/4px 7px no-repeat,
  linear-gradient(var(--clay),var(--clay)) 100% 60%/7px 4px no-repeat;border-radius:4px}
.lead{margin:8px 0 0;color:var(--muted);max-width:60ch;font-weight:600}
.note{margin:12px 0 0;padding:11px 14px;border-radius:16px;background:var(--accent-soft);font-size:.86rem}
.sumrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;align-items:center;font-size:.73rem;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.today{background:var(--today-soft);color:var(--today)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.neutral{background:var(--surface);color:var(--muted);border:1.5px solid var(--line)}

/* floor plan */
.planwrap{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:0 3px 0 var(--line),0 12px 28px var(--lift)}
.plan{display:grid;user-select:none;-webkit-user-select:none}
.plan.edit{touch-action:none}
.cell{aspect-ratio:1;min-width:0}
.cell.empty{border:1.5px dashed var(--line);border-radius:6px;margin:1px}
.plan:not(.edit) .cell.empty{border-color:transparent;background:radial-gradient(circle,var(--line) 2px,transparent 2.5px)}
.cell.room{cursor:pointer}
.plan.edit .cell{cursor:crosshair}
.cell.active{background-image:repeating-linear-gradient(45deg,transparent 0 5px,var(--hatch) 5px 10px)}
.rlabel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px;pointer-events:none;text-align:center;min-width:0;z-index:1}
.rname{font-family:var(--f-display);font-size:.76rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.rbadge{font-size:.66rem;font-weight:800;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--late);color:var(--on-badge);font-variant-numeric:tabular-nums}
.rbadge.t{background:var(--warm)}
.gridinfo{font-size:.74rem;color:var(--muted);text-align:center;margin-top:-8px}
.hint{margin:-8px 0 0;font-size:.8rem;color:var(--muted);text-align:center}

/* setup */
.palette{display:flex;flex-wrap:wrap;gap:7px}
.chip-type{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.chip-type:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.chip-type i{width:14px;height:14px;border-radius:5px;border:2px solid var(--wall)}
.chip-type.erase.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{font-size:.84rem;padding:10px 14px;border-radius:16px;background:var(--surface2)}
.roomlist{display:flex;flex-direction:column;gap:8px}
.redit{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px}
.redit.on{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.redit .nm{min-width:0;display:flex;flex-direction:column}
.redit input{min-width:0;width:100%;border:0;border-bottom:1.5px dashed var(--line);background:transparent;font-weight:700;padding:3px 0}
.redit .meta{font-size:.72rem;color:var(--muted)}
.sw{width:18px;height:18px;border-radius:6px;border:2px solid var(--wall)}
.setup-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:12px 18px;font-weight:800;border:1.5px solid transparent;cursor:pointer;background:var(--surface2);text-align:center;box-shadow:0 3px 0 var(--lift)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lift)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--shadow)}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none}
.btn.small{padding:7px 14px;font-size:.8rem}
.btn.block{width:100%}
.btn.armed{background:var(--late);color:var(--on-badge);border-color:var(--late)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.15rem;line-height:1;width:30px;height:30px;border-radius:999px;cursor:pointer}
.x:hover{background:var(--surface2)}

/* cards & tasks */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 var(--line),0 10px 24px var(--lift)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px 0;border-top:1.5px solid var(--line)}
.task:first-child{border-top:0;padding-top:2px}
.t-main{min-width:0}
.t-name{font-weight:800}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);margin-top:4px}
.t-room{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);margin-bottom:2px;font-weight:700}
.t-room i{width:10px;height:10px;border-radius:4px;border:1.5px solid var(--wall)}
.done{border:2px solid var(--hi);color:var(--ink);background:transparent;border-radius:999px;padding:7px 13px;font-size:.78rem;font-weight:800;cursor:pointer;white-space:nowrap}
.task.late .done,.task.today .done{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--shadow)}
.done:active{transform:translateY(2px);box-shadow:none}
.empty-msg{margin:0;font-size:.86rem;color:var(--muted)}
.addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addrow input,.addrow select{flex:1 1 140px;min-width:0;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:600}
.addrow input.num{flex:0 0 64px;text-align:center;font-variant-numeric:tabular-nums}
.unit{font-size:.8rem;color:var(--muted)}

/* home */
.rooms{display:flex;flex-direction:column;gap:9px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;border:0;background:var(--surface);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.rrow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.rrow .sw{width:34px;height:34px;border-radius:11px}
.rrow .rn{font-family:var(--f-display);font-weight:600;display:block;font-size:1rem}
.rrow .rs{font-size:.76rem;color:var(--muted);display:block}
.chev{color:var(--hi);font-size:1.4rem;font-weight:800}

/* room */
.back{align-self:flex-start;border:0;background:var(--surface);padding:6px 14px;border-radius:999px;color:var(--ink);font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;padding:18px;border-radius:var(--radius);background:var(--rc);border:var(--wallw) solid var(--wall);box-shadow:0 5px 0 var(--wall)}
.rhead .h1{font-size:1.5rem}
.rhead .eyebrow{color:var(--ink);opacity:.7}
.rhead .small{color:var(--ink);opacity:.75;margin:6px 0 0}
.mini{display:grid;gap:3px;flex:0 0 auto}
.mini i,.mini b{width:11px;height:11px;border-radius:4px}
.mini i{background:var(--wall)}

/* wardrobe */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filt{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:.78rem;font-weight:700;cursor:pointer}
.filt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clothes,.stock{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.clothes li,.stock li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1.5px solid var(--line)}
.clothes li:first-child,.stock li:first-child{border-top:0}
.c-name{font-weight:800}
.c-cat{font-size:.74rem;color:var(--muted)}
.state{border:0;border-radius:999px;padding:6px 12px;font-size:.75rem;font-weight:800;cursor:pointer;min-width:96px}
.s-temiz{background:var(--ok-soft);color:var(--ok)}
.s-kirli{background:var(--late-soft);color:var(--late)}
.s-utu{background:var(--today-soft);color:var(--today)}
.callout{padding:11px 14px;border-radius:16px;background:var(--today-soft);font-size:.86rem}

/* stock & fridge */
.s-name{min-width:0;overflow-wrap:anywhere;font-weight:700}
.lv-yok .s-name{color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:999px;font-size:.74rem;font-weight:700;cursor:pointer;color:var(--muted)}
.lv-var .seg button.on{background:var(--ok-soft);color:var(--ok);font-weight:800}
.lv-az .seg button.on{background:var(--today-soft);color:var(--today);font-weight:800}
.lv-yok .seg button.on{background:var(--late-soft);color:var(--late);font-weight:800}
.shop{padding:14px;border-radius:18px;background:var(--bg);border:2px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.shoptext{margin:0;font-size:.9rem;user-select:all;-webkit-user-select:all}
.fridge{border-radius:18px;overflow:hidden;background:var(--bg);border:2px solid var(--line)}
.fridge img{display:block;width:100%;max-height:360px;object-fit:cover}
.fridge-empty{display:flex;gap:14px;align-items:center;padding:16px;font-size:.86rem;color:var(--muted)}
.fridge-empty p{margin:0}
.fridge-empty svg{flex:0 0 40px;color:var(--hi)}

/* notifications */
.nlist{display:flex;flex-direction:column;gap:9px}
.notif{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:13px 14px;border-radius:20px;background:var(--surface);border:0;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.n-dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--hi)}
.notif.late .n-dot{background:var(--late)}
.notif.today .n-dot{background:var(--warm)}
.n-title{display:block;font-weight:800;font-size:.9rem}
.n-text{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1.5px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow small{display:block;color:var(--muted);font-size:.74rem}
.setrow input[type=time]{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums;font-weight:700}
.tg{appearance:none;-webkit-appearance:none;margin:0;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 2px 4px var(--lift);transition:transform .2s}
.tg:checked{background:var(--hi)}
.tg:checked::after{transform:translateX(20px)}

/* nav, toast, push */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav-in{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--navy);border-radius:26px;padding:7px;box-shadow:0 10px 30px var(--shadow)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:7px 0;border-radius:20px;font-size:.68rem;font-weight:800;color:#A9B4C2;cursor:pointer}
.nav button.on{color:var(--navy);background:var(--mint)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
.nbadge{position:absolute;top:2px;left:calc(50% + 7px);font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--clay);color:var(--navy)}
:root[data-theme="dark"] .nav-in{background:#1C2232}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav-in{background:#1C2232}}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:18px;font-size:.86rem;font-weight:700;box-shadow:0 8px 24px var(--shadow)}
.push{position:fixed;z-index:30;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);width:min(428px,calc(100% - 24px));background:var(--surface);border:0;border-radius:22px;padding:12px 14px;box-shadow:0 12px 32px var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:2px 12px;text-align:left;cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.push.show{transform:translate(-50%,0)}
.push .appicon{grid-row:1/4;align-self:center}
.p-app{font-size:.7rem;color:var(--muted);font-weight:700}
.p-t{font-weight:800;font-size:.88rem}
.p-x{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.push,.tg,.tg::after{transition:none}.btn:active,.rrow:active,.chip-type:active,.done:active{transform:none}}

<script>
const DAY = 864e5;
const KEY = 'layfapp.v1';
const TYPES = {
  yatak:  {label:'Yatak odası',   mod:'gardirop',  tasks:[['Odayı süpür ve sil',7],['Çarşaf değişimi',7],['Toz alma',7],['Havalandırma',1],['Yastık ve yorgan havalandırma',30]]},
  mutfak: {label:'Mutfak',        mod:'buzdolabi', tasks:[['Bulaşık',1],['Tezgah silme',1],['Çöpü çıkar',2],['Buzdolabı temizliği',30],['Fırın temizliği',30],['Yer silme',7]]},
  banyo:  {label:'Banyo',         mod:'stok',      tasks:[['Lavabo ve ayna',3],['Klozet',3],['Duş / küvet',7],['Havlu değişimi',4],['Yer silme',7]]},
  salon:  {label:'Salon',         mod:'bitki',     tasks:[['Süpürme',3],['Toz alma',7],['Koltuk minderleri',14],['Cam silme',30]]},
  calisma:{label:'Çalışma odası', mod:null,        tasks:[['Masa düzeni',7],['Toz alma',7],['Kablo ve şarj düzeni',30]]},
  cocuk:  {label:'Çocuk odası',   mod:'gardirop',  tasks:[['Oyuncak toplama',1],['Çarşaf değişimi',7],['Süpürme',3]]},
  antre:  {label:'Antre',         mod:null,        tasks:[['Ayakkabılık düzeni',7],['Yer silme',7]]},
  balkon: {label:'Balkon',        mod:'bitki',     tasks:[['Süpürme',7],['Cam ve korkuluk',30]]},
  camasir:{label:'Çamaşır odası', mod:'stok',      tasks:[['Çamaşır yıkama',3],['Makine filtresi',30],['Ütü',7]]}
};
const STOCK_DEF = {
  mutfak:['Süt','Yumurta','Peynir','Ekmek'],
  banyo:['Tuvalet kağıdı','Şampuan','Diş macunu','Sıvı sabun'],
  camasir:['Deterjan','Yumuşatıcı','Leke çıkarıcı']
};
const CATS = ['Üst','Alt','Elbise / Takım','Dış giyim','Ev / Pijama','İç giyim','Ayakkabı','Aksesuar'];
const CSTATE = {temiz:'Temiz', kirli:'Kirli', utu:'Ütülenecek'};
const LV = [['var','Var'],['az','Az'],['yok','Bitti']];

let S;
let view, roomId = null, tool = null, pushShown = false, clearArm = false;

const uid = () => Math.random().toString(36).slice(2, 9);
const ago = d => Date.now() - d * DAY;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sod = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const daysSince = ts => Math.round((sod(Date.now()) - sod(ts)) / DAY);
const fmtShort = ts => new Date(ts).toLocaleDateString('tr-TR', {day:'numeric', month:'short'});
const fmtLong = ts => new Date(ts).toLocaleDateString('tr-TR', {weekday:'long', day:'numeric', month:'long'});

function makeRoom(type){
  const id = uid();
  const n = S.order.filter(r => S.rooms[r].type === type).length;
  S.rooms[id] = {id, type, name: TYPES[type].label + (n ? ' ' + (n + 1) : '')};
  S.order.push(id);
  S.tasks[id] = TYPES[type].tasks.map(([name, every]) => ({id: uid(), name, every, last: null}));
  const m = TYPES[type].mod;
  if (m === 'gardirop') S.mod[id] = {wardrobe: [], filter: 'all'};
  else if (m === 'buzdolabi') S.mod[id] = {photo: null, photoAt: null, stock: STOCK_DEF.mutfak.map(name => ({id: uid(), name, lvl: 'var'}))};
  else if (m === 'stok') S.mod[id] = {stock: (STOCK_DEF[type] || []).map(name => ({id: uid(), name, lvl: 'var'}))};
  else if (m === 'bitki') S.mod[id] = {plants: []};
  else S.mod[id] = {};
  return id;
}

function seed(){
  S = {v:1, setup:false, cols:6, rows:8, cells:[], rooms:{}, order:[], tasks:{}, mod:{},
       settings:{time:'09:00', routine:true, stock:true, laundry:true}};
  const map = {Y:makeRoom('yatak'), M:makeRoom('mutfak'), B:makeRoom('banyo'), A:makeRoom('antre'), S:makeRoom('salon'), L:makeRoom('balkon')};
  S.rooms[map.Y].name = 'Yatak odam';
  const layout = 'YYYMMM' + 'YYYMMM' + 'YYYABB' + 'AAAABB' + 'SSSSSL' + 'SSSSSL' + 'SSSSSL' + '......';
  S.cells = [...layout].map(ch => map[ch] || null);
  const agos = {Y:[5,9,7,0,12], M:[1,0,3,26,40,4], B:[2,5,9,4,3], A:[3,8], S:[3,7,6,31], L:[10,12]};
  for (const k in map) S.tasks[map[k]].forEach((t, i) => t.last = ago(agos[k][i]));
  const w = (name, cat, state) => ({id: uid(), name, cat, state});
  S.mod[map.Y].wardrobe = [
    w('Beyaz gömlek','Üst','temiz'), w('Kot pantolon','Alt','temiz'), w('Siyah kazak','Üst','kirli'),
    w('Spor tişört','Üst','kirli'), w('Lacivert takım','Elbise / Takım','utu'), w('Kaban','Dış giyim','temiz'),
    w('Pijama takımı','Ev / Pijama','kirli'), w('Keten gömlek','Üst','utu')
  ];
  const st = (name, lvl) => ({id: uid(), name, lvl});
  S.mod[map.M].stock = [st('Süt','az'), st('Yumurta','var'), st('Beyaz peynir','var'), st('Domates','yok'), st('Yoğurt','var'), st('Tereyağı','az'), st('Biber','yok'), st('Ekmek','var')];
  S.mod[map.B].stock = [st('Tuvalet kağıdı','az'), st('Şampuan','var'), st('Diş macunu','var'), st('Sıvı sabun','yok')];
  const p = (name, every, d) => ({id: uid(), name, every, last: ago(d)});
  S.mod[map.S].plants = [p('Monstera', 7, 6), p('Paşa kılıcı', 14, 3)];
  S.mod[map.L].plants = [p('Fesleğen', 2, 2), p('Sardunya', 3, 1)];
  return S;
}

function load(){ try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return null; }
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){
    try {
      const copy = JSON.parse(JSON.stringify(S));
      for (const k in copy.mod) if (copy.mod[k].photo) { copy.mod[k].photo = null; }
      localStorage.setItem(KEY, JSON.stringify(copy));
    } catch(e2){}
    return false;
  }
}

/* ---------- status ---------- */
function status(t){
  if (t.last == null) return {k:'today', diff:0, label:'Başlanmadı'};
  const diff = t.every - daysSince(t.last);
  if (diff < 0) return {k:'late', diff, label:`${-diff} gün gecikti`};
  if (diff === 0) return {k:'today', diff, label:'Bugün'};
  if (diff === 1) return {k:'ok', diff, label:'Yarın'};
  return {k:'ok', diff, label:`${diff} gün kaldı`};
}
function agoText(ts){
  if (ts == null) return 'henüz yok';
  const n = daysSince(ts);
  return n <= 0 ? 'bugün' : n === 1 ? 'dün' : `${n} gün önce`;
}
function allTasks(){
  const out = [];
  for (const rid of S.order){
    (S.tasks[rid] || []).forEach(t => out.push({t, rid, list:'tasks', s:status(t)}));
    ((S.mod[rid] || {}).plants || []).forEach(t => out.push({t, rid, list:'plants', s:status(t)}));
  }
  return out;
}
function roomCounts(rid){
  const a = allTasks().filter(x => x.rid === rid);
  return {late: a.filter(x => x.s.k === 'late').length, today: a.filter(x => x.s.k === 'today').length, all: a};
}
const cellCount = id => S.cells.filter(x => x === id).length;
function shopItems(){
  const out = [];
  for (const rid of S.order) ((S.mod[rid] || {}).stock || []).forEach(x => { if (x.lvl !== 'var') out.push({x, rid}); });
  return out;
}
function notifs(){
  const ns = [];
  const set = S.settings;
  if (set.routine){
    allTasks().filter(x => x.s.k !== 'ok').sort((a, b) => a.s.diff - b.s.diff).forEach(({t, rid, list, s}) => {
      const room = S.rooms[rid].name;
      const plant = list === 'plants';
      ns.push({k:s.k, rid, title:`${room} · ${t.name}`,
        text: s.k === 'late' ? `${-s.diff} gün gecikti. En son ${agoText(t.last)}.` : (plant ? 'Bugün sulama günü.' : t.last == null ? 'Henüz hiç işaretlenmedi.' : 'Bugün yapılacak.')});
    });
  }
  for (const rid of S.order){
    const m = S.mod[rid] || {}; const room = S.rooms[rid].name;
    if (set.stock && m.stock){
      const out = m.stock.filter(x => x.lvl === 'yok');
      if (out.length) ns.push({k:'today', rid, title:`${room} · ${out.length} ürün bitti`, text: out.map(x => x.name).join(', ')});
    }
    if (set.stock && 'photo' in m && (!m.photoAt || daysSince(m.photoAt) > 7))
      ns.push({k:'ok', rid, title:`${room} · Buzdolabı fotoğrafı`, text: m.photoAt ? `Son fotoğraf ${agoText(m.photoAt)} çekildi. Yenisini çek.` : 'Henüz fotoğraf yok. Markete gitmeden önce bir tane çek.'});
    if (set.laundry && m.wardrobe){
      const d = m.wardrobe.filter(c => c.state === 'kirli').length;
      if (d >= 3) ns.push({k:'today', rid, title:`${room} · ${d} parça kirli kıyafet`, text:'Bir makine dolusu birikti, çamaşır zamanı.'});
    }
  }
  const order = {late:0, today:1, ok:2};
  return ns.sort((a, b) => order[a.k] - order[b.k]);
}

/* ---------- plan ---------- */
function planInner(edit){
  const {cols, rows, cells} = S;
  let h = '';
  const W = 'var(--wallw) solid var(--wall)';
  for (let i = 0; i < cols * rows; i++){
    const id = cells[i], r = (i / cols) | 0, c = i % cols;
    const pos = `grid-area:${r + 1}/${c + 1}`;
    if (!id){ h += `<div class="cell empty" data-i="${i}" style="${pos}"></div>`; continue; }
    const room = S.rooms[id];
    const same = (rr, cc) => rr >= 0 && rr < rows && cc >= 0 && cc < cols && cells[rr * cols + cc] === id;
    const t = !same(r-1,c), bo = !same(r+1,c), l = !same(r,c-1), ri = !same(r,c+1), R = 'var(--cr)';
    const st = `${pos};background-color:var(--r-${room.type});border-top:${t?W:'0'};border-bottom:${bo?W:'0'};border-left:${l?W:'0'};border-right:${ri?W:'0'};border-radius:${t&&l?R:0} ${t&&ri?R:0} ${bo&&ri?R:0} ${bo&&l?R:0}`;
    h += `<div class="cell room${edit && id === tool ? ' active' : ''}" data-i="${i}" ${edit ? '' : `data-act="open" data-id="${id}"`} style="${st}"></div>`;
  }
  for (const id of S.order){
    let minr = 99, minc = 99, maxr = -1, maxc = -1;
    cells.forEach((x, i) => { if (x !== id) return; const r = (i / cols) | 0, c = i % cols;
      minr = Math.min(minr, r); maxr = Math.max(maxr, r); minc = Math.min(minc, c); maxc = Math.max(maxc, c); });
    if (maxr < 0) continue;
    let badge = '';
    if (!edit){ const rc = roomCounts(id); const n = rc.late + rc.today;
      if (n) badge = `<span class="rbadge${rc.late ? '' : ' t'}">${n}</span>`; }
    h += `<div class="rlabel" style="grid-area:${minr+1}/${minc+1}/${maxr+2}/${maxc+2}"><span class="rname">${esc(S.rooms[id].name)}</span>${badge}</div>`;
  }
  return h;
}
const planHTML = edit => `<div class="planwrap"><div class="plan${edit ? ' edit' : ''}" id="plan" style="grid-template-columns:repeat(${S.cols},1fr)">${planInner(edit)}</div></div>`;

function miniShape(id){
  const {cols, cells} = S; let minr = 99, minc = 99, maxr = -1, maxc = -1;
  cells.forEach((x, i) => { if (x !== id) return; const r = (i / cols) | 0, c = i % cols;
    minr = Math.min(minr, r); maxr = Math.max(maxr, r); minc = Math.min(minc, c); maxc = Math.max(maxc, c); });
  if (maxr < 0) return '';
  let h = `<div class="mini" aria-hidden="true" style="grid-template-columns:repeat(${maxc - minc + 1},10px)">`;
  for (let r = minr; r <= maxr; r++) for (let c = minc; c <= maxc; c++) h += cells[r * cols + c] === id ? '<i></i>' : '<b></b>';
  return h + '</div>';
}

  const ns = notifs(); const s = S.settings;
  const tog = (id, key, label, sub) => `<label class="setrow" for="${id}"><span>${label}<small>${sub}</small></span><input type="checkbox" class="tg" id="${id}" data-set="${key}" ${s[key] ? 'checked' : ''}></label>`;
  return `<section><h1 class="h1">Bildirimler</h1><p class="lead">Layfapp her sabah <span class="mono">${esc(s.time)}</span>'da bunları telefonuna bildirim olarak gönderir.</p></section>
  <div class="nlist">${ns.map(n => `<button class="notif ${n.k}" data-act="open" data-id="${n.rid}"><span class="n-dot"></span><span><span class="n-title">${esc(n.title)}</span><span class="n-text">${esc(n.text)}</span></span></button>`).join('') || '<section class="card"><p class="empty-msg">Bildirim yok. Evde her şey yolunda.</p></section>'}</div>
  <section class="card"><h2 class="h2">Bildirim ayarları</h2><div>
    <label class="setrow" for="set-time"><span>Günlük özet saati<small>Sabah özeti bu saatte gelir</small></span><input type="time" id="set-time" value="${esc(s.time)}"></label>
    ${tog('set-routine', 'routine', 'Rutin hatırlatmaları', 'Geciken ve bugün yapılacak işler, bitki sulama')}
    ${tog('set-stock', 'stock', 'Eksik ürünler', 'Biten ürünler ve eski buzdolabı fotoğrafı')}
    ${tog('set-laundry', 'laundry', 'Çamaşır', '3 ve daha fazla kirli parça birikince')}</div></section>
  <p class="tiny muted">Bu prototipte bildirimler uygulama içinde görünüyor. Mobil sürümde aynı kurallar telefonun bildirim merkezine düşer.</p>`;
}
const ICONS = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  today:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/>',
  notif:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  setup:'<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="5"/><rect x="13" y="10" width="8" height="11"/><rect x="3" y="13" width="8" height="8"/>'
};
function navHTML(){
  const n = notifs().length;
  const cur = view === 'room' ? 'home' : view;
  return `<div class="nav-in">${[['home','Ev'],['today','Bugün'],['notif','Bildirimler'],['setup','Plan']].map(([v, l]) => `<button class="${cur === v ? 'on' : ''}" data-act="go" data-v="${v}" ${cur === v ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[v]}</svg>${l}${v === 'notif' && n ? `<span class="nbadge">${n}</span>` : ''}</button>`).join('')}</div>`;
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById('app');
  const body = view === 'setup' ? vSetup() : view === 'today' ? vToday() : view === 'notif' ? vNotif() : view === 'room' ? vRoom() : vHome();
  app.innerHTML = header() + body;
  const nav = document.getElementById('nav');
  nav.hidden = !S.setup; nav.innerHTML = S.setup ? navHTML() : '';
  if (view === 'setup') bindPaint();
  if (view === 'home' && !pushShown){ pushShown = true; setTimeout(showPush, 900); }
}
function go(v){ view = v; if (v !== 'setup'){ tool = null; clearArm = false; } render(); window.scrollTo(0, 0); }

let toastT;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800);
}
function showPush(){
  const n = notifs()[0]; if (!n) return;
  const p = document.getElementById('push');
  p.innerHTML = `<span class="appicon" aria-hidden="true"></span><span class="p-app">layfapp · şimdi</span><span class="p-t">${esc(n.title)}</span><span class="p-x">${esc(n.text)}</span>`;
  p.dataset.id = n.rid; p.classList.add('show');
  setTimeout(() => p.classList.remove('show'), 6000);
}
document.getElementById('push').addEventListener('click', e => {
  const p = e.currentTarget; p.classList.remove('show');
  if (p.dataset.id && S.rooms[p.dataset.id]){ roomId = p.dataset.id; go('room'); }
});

/* ---------- painting ---------- */
function refreshSetupBits(){
  document.getElementById('toolbar').innerHTML = toolText();
  document.getElementById('roomlist').innerHTML = roomListEdit();
  document.getElementById('plan').innerHTML = planInner(true);
  document.querySelector('.chip-type.erase').classList.toggle('on', tool === 'erase');
}
function paint(i){
  if (!tool){
    const id = S.cells[i];
    if (id){ tool = id; refreshSetupBits(); } else toast('Önce bir oda türü seç.');
    return false;
  }
  const val = tool === 'erase' ? null : tool;
  if (S.cells[i] === val) return false;
  S.cells[i] = val;
  document.getElementById('plan').innerHTML = planInner(true);
  return true;
}
let painting = false, painted = false;
function bindPaint(){
  const plan = document.getElementById('plan');
  plan.addEventListener('pointerdown', e => {
    const c = e.target.closest('.cell'); if (!c) return;
    e.preventDefault(); painting = true; painted = paint(+c.dataset.i) || painted;
  });
  plan.addEventListener('pointermove', e => {
    if (!painting) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const c = el && el.closest ? el.closest('.cell') : null;
    if (c && plan.contains(c)) painted = paint(+c.dataset.i) || painted;
  });
}
window.addEventListener('pointerup', () => {
  if (!painting) return; painting = false;
  if (painted){ painted = false; save(); const rl = document.getElementById('roomlist'); if (rl) rl.innerHTML = roomListEdit(); }
});

/* ---------- events ---------- */
function listOf(rid, list){ return list === 'plants' ? (S.mod[rid].plants ||= []) : (S.tasks[rid] ||= []); }
function copyText(text, el){
  const fallback = () => { if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Liste seçildi, kopyalayabilirsin.'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Alışveriş listesi kopyalandı.'), fallback); } catch(e){ fallback(); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset;
  switch (d.act){
    case 'go': go(d.v); break;
    case 'open': if (S.rooms[d.id]){ roomId = d.id; go('room'); } break;
    case 'newroom': { tool = makeRoom(d.type); clearArm = false; save(); refreshSetupBits(); toast(`${S.rooms[tool].name} eklendi. Bloklara dokunarak çiz.`); break; }
    case 'erase': tool = tool === 'erase' ? null : 'erase'; refreshSetupBits(); break;
    case 'tool': tool = tool === d.id ? null : d.id; refreshSetupBits(); break;
    case 'delroom': {
      const id = d.id; S.cells = S.cells.map(x => x === id ? null : x);
      delete S.rooms[id]; delete S.tasks[id]; delete S.mod[id]; S.order = S.order.filter(x => x !== id);
      if (tool === id) tool = null; save(); refreshSetupBits(); break;
    }
    case 'clearplan': {
      if (!clearArm){ clearArm = true; render(); setTimeout(() => { if (clearArm && view === 'setup'){ clearArm = false; render(); } }, 4000); break; }
      clearArm = false; S.cells = S.cells.map(() => null); S.rooms = {}; S.order = []; S.tasks = {}; S.mod = {}; tool = null;
      save(); render(); toast('Plan temizlendi. İlk odanı seç.'); break;
    }
    case 'savesetup': {
      for (const id of [...S.order]) if (!cellCount(id)){ delete S.rooms[id]; delete S.tasks[id]; delete S.mod[id]; S.order = S.order.filter(x => x !== id); }
      if (!S.order.length){ toast('Kaydetmek için en az bir oda çiz.'); render(); break; }
      const first = !S.setup; S.setup = true; save(); go('home'); toast(first ? 'Evin hazır. Odalara dokunarak işleri gör.' : 'Plan kaydedildi.'); break;
    }
    case 'done': {
      const t = listOf(d.rid, d.list).find(x => x.id === d.tid); if (!t) break;
      t.last = Date.now(); save(); render();
      toast(`${t.name} tamam. Sıradaki: ${fmtShort(Date.now() + t.every * DAY)}`); break;
    }
    case 'deltask': { const arr = listOf(d.rid, d.list); const i = arr.findIndex(x => x.id === d.tid); if (i > -1){ const [t] = arr.splice(i, 1); save(); render(); toast(`${t.name} silindi.`); } break; }
    case 'filter': S.mod[d.rid].filter = d.f; save(); render(); break;
    case 'cycle': { const c = S.mod[d.rid].wardrobe.find(x => x.id === d.id); if (!c) break; c.state = {temiz:'kirli', kirli:'utu', utu:'temiz'}[c.state]; save(); render(); break; }
    case 'delcloth': S.mod[d.rid].wardrobe = S.mod[d.rid].wardrobe.filter(x => x.id !== d.id); save(); render(); break;
    case 'lvl': { const x = S.mod[d.rid].stock.find(y => y.id === d.id); if (x){ x.lvl = d.lvl; save(); render(); } break; }
    case 'delstock': S.mod[d.rid].stock = S.mod[d.rid].stock.filter(x => x.id !== d.id); save(); render(); break;
    case 'copyshop': {
      const items = d.rid === 'all' ? shopItems().map(s => s.x) : S.mod[d.rid].stock.filter(x => x.lvl !== 'var');
      copyText(items.map(x => '- ' + x.name + (x.lvl === 'az' ? ' (azaldı)' : '')).join('\n'), document.getElementById('shop-' + d.rid)); break;
    }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const rid = f.dataset.rid; const name = f.n.value.trim(); if (!name) return;
  let focusId = f.n.id;
  if (f.dataset.form === 'addtask'){
    const every = Math.min(365, Math.max(1, parseInt(f.e.value, 10) || 7));
    listOf(rid, f.dataset.list).push({id: uid(), name, every, last: null});
    toast(`${name} eklendi.`);
  } else if (f.dataset.form === 'addcloth'){
    S.mod[rid].wardrobe.push({id: uid(), name, cat: f.c.value, state: 'temiz'});
    if (S.mod[rid].filter !== 'all' && S.mod[rid].filter !== 'temiz') S.mod[rid].filter = 'all';
  } else if (f.dataset.form === 'addstock'){
    S.mod[rid].stock.push({id: uid(), name, lvl: 'yok'});
    toast(`${name} alışveriş listesine eklendi.`);
  }
  save(); render();
  const el = document.getElementById(focusId); if (el) el.focus();
});
document.addEventListener('input', e => {
  const id = e.target.dataset.rename;
  if (id && S.rooms[id]){ S.rooms[id].name = e.target.value.slice(0, 40) || TYPES[S.rooms[id].type].label; save();
    document.getElementById('plan').innerHTML = planInner(true); document.getElementById('toolbar').innerHTML = toolText(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.photo && el.files && el.files[0]) onPhoto(el.files[0], el.dataset.photo);
  if (el.id === 'set-time' && el.value){ S.settings.time = el.value; save(); render(); }
  if (el.dataset.set){ S.settings[el.dataset.set] = el.checked; save(); render(); }
});
function onPhoto(file, rid){
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      S.mod[rid].photo = cv.toDataURL('image/jpeg', 0.72); S.mod[rid].photoAt = Date.now();
      const ok = save(); render();
      toast(ok ? 'Buzdolabı fotoğrafı güncellendi.' : 'Fotoğraf eklendi. Cihazda yer olmadığı için yalnızca bu oturumda kalacak.');
    };
    img.onerror = () => toast('Bu dosya açılamadı. JPG ya da PNG bir fotoğraf seç.');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- boot ---------- */
S = load() || seed();
view = S.setup ? 'home' : 'setup';
render();
</script>
